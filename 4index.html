    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广州优玛</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->

      rel="stylesheet"

    />

    <!-- Tailwind配置 -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#F8F5F0", // 主色调-米白色
              secondary: "#F3EDE5", // 辅色1-浅米色
              accent: "#E8E2D9", // 辅色2-浅灰色
              text: "#5C5550", // 文字色-柔和深灰

            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],

    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
        .product-card {
          @apply bg-white rounded-xl shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden cursor-pointer;
        }
        .btn-close {
          @apply absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full bg-secondary hover:bg-accent transition-colors text-text;
        }
        .category-btn {
          @apply px-5 py-2 rounded-full text-sm md:text-base bg-white hover:bg-secondary transition-colors duration-200 font-medium;
        }
        .category-btn.active {
          @apply bg-secondary text-[#4A443F] shadow-sm;
        }
      }
    </style>
  </head>

    <!-- 顶部介绍模块 -->
    <header class="py-12 px-4 md:px-8 bg-secondary">
      <div class="container mx-auto max-w-6xl text-center">
        <h1 class="text-[clamp(1.8rem,4vw,3rem)] font-bold mb-4 text-[#4A443F]">
          广州优玛 · Umart · 一店
        </h1>
        <p
          class="text-lg md:text-xl max-w-3xl mx-auto opacity-90 leading-relaxed"
        >
          主营蕾丝,网布,珠片,专供二批
        </p>
      </div>
    </header>

    <!-- 产品展示模块 -->
    <main class="py-16 px-4 md:px-8">
      <div class="container mx-auto max-w-6xl">
        <h2 class="text-2xl md:text-3xl font-semibold text-center mb-6">
          精选产品
        </h2>

        <!-- ===================== 分类导航栏 ===================== -->
        <div class="flex justify-center flex-wrap gap-3 mb-10">
          <button class="category-btn active" onclick="filterProducts('all')">
            全部产品
          </button>
          <button class="category-btn" onclick="filterProducts('leisi')">
            蕾丝系列
          </button>
          <button class="category-btn" onclick="filterProducts('wangbu')">
            网布系列
          </button>
          <button class="category-btn" onclick="filterProducts('zp')">
            珠片系列
          </button>
        </div>

        <!-- 产品网格：电脑端3列，手机端2列 -->
        <div
          id="productGrid"
          class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-8"
        >
          <!-- 产品会由JS自动渲染 -->
        </div>
      </div>
    </main>

        <div
          class="flex flex-col md:flex-row justify-between items-center gap-8 text-center md:text-left"
        >

          </div>

            <div class="bg-white p-3 rounded-lg shadow-sm">

                alt="微信二维码"
                class="w-32 h-32 object-cover"
              />
            </div>
            <p class="mt-2 text-sm">扫码添加微信客服</p>
          </div>
        </div>
        <div
          class="mt-8 pt-6 border-t border-accent text-center text-sm opacity-75"
        >
          © 2025 广州优玛商贸 | 工作时间 10:00-18:00
        </div>
      </div>
    </footer>

      // 初始化页面：渲染所有产品
      window.onload = function () {
        renderProducts(products);
      };

      // 渲染产品到页面
      function renderProducts(productsToRender) {
        const grid = document.getElementById("productGrid");
        let html = "";

        productsToRender.forEach((product) => {
          html += `
                <div class="product-card" onclick="openProductModal(${product.id})">
                    <div class="h-48 overflow-hidden">
                        <img src="${product.images[0]}" alt="产品图片" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <h3 class="text-lg font-semibold mb-2">${product.title}</h3>
                        <p class="text-sm opacity-85 line-clamp-2">${product.desc}</p>
                    </div>
                </div>`;
        });

        grid.innerHTML = html;
      }

      // 分类筛选功能
      function filterProducts(category) {
        // 切换按钮高亮
        document.querySelectorAll(".category-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");

        // 筛选产品
        if (category === "all") {
          renderProducts(products);
        } else {
          const filtered = products.filter(
            (item) => item.category === category,
          );
          renderProducts(filtered);
        }
      }
